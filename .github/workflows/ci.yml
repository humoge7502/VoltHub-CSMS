name: ci
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npx eslint . --max-warnings 0
      - run: npx prettier --check .
  quality:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: node --check apps/api/src/server.js && node --check apps/api/src/routes.js && node --check apps/api/src/extended.js && node --check apps/api/src/errors.js && node --check apps/api/src/db/oracle.js && node --check apps/api/src/db/index.js && node --check apps/api/src/observability.js && node --check apps/worker/src/index.js && node --check apps/worker/src/relay-timescale.js && node --check apps/api/src/ocpp/gateway.js
      - run: npm run test -w apps/api
      - run: npm run test:race -w apps/api
      - run: node apps/api/test/security.js
      - run: node apps/api/test/xlayer.js
      - run: node apps/api/test/ocpp-remote.js
      - run: node test/sql/run-invariants.js
      - run: node scripts/check-openapi.js
      - run: npm run test -w apps/simulator
      - run: npm run test:e2e
      - run: npm install --no-audit --no-fund
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
  db-tests:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim
        env: { ORACLE_PASSWORD: volthub_dev_pwd, APP_USER: volthub, APP_USER_PASSWORD: volthub_dev_pwd }
        ports: ['1521:1521']
        options: >-
          --health-cmd "echo 'select 1 from dual;' | sqlplus -S volthub/volthub_dev_pwd@localhost/freepdb1 || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 30 --health-start-period 60s
      timescale:
        image: timescale/timescaledb:2.17.2-pg16
        env: { POSTGRES_DB: volthub, POSTGRES_USER: volthub, POSTGRES_PASSWORD: volthub_dev_pwd }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U volthub"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ORACLE_HOST: localhost
      ORACLE_PORT: 1521
      ORACLE_SERVICE: freepdb1
      ORACLE_USER: volthub
      ORACLE_PASSWORD: volthub_dev_pwd
      TS_HOST: localhost
      TS_PORT: 5432
      TS_DB: volthub
      TS_USER: volthub
      TS_PASSWORD: volthub_dev_pwd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      - run: npm install --no-audit --no-fund oracledb pg
        working-directory: apps/api
      - name: Wait for Oracle + Timescale
        run: |
          for i in $(seq 1 30); do (echo > /dev/tcp/localhost/1521) 2>/dev/null && break; echo "wait oracle $i"; sleep 10; done
          for i in $(seq 1 12); do (echo > /dev/tcp/localhost/5432) 2>/dev/null && break; echo "wait ts $i"; sleep 5; done
      - name: Migrate (in-container sqlplus when runner lacks it + psql; Oracle seeded)
        env:
          SEED_DB: '1'
        run: bash scripts/migrate.sh
      # These suites boot the API against the in-memory store by design. The job-level
      # ORACLE_HOST env would make db/index.js attach the Oracle write-through adapter
      # mid-run (async hydration) — a nondeterministic race that flaked these steps with
      # 500s. Blank it so they run local-only; the DB-backed step below is the Oracle gate.
      - name: Contract tests (local store, fast)
        env: { ORACLE_HOST: '' }
        run: npm run test -w apps/api
      - name: Race suite (local mutex semantics)
        env: { ORACLE_HOST: '' }
        run: npm run test:race -w apps/api
      - name: Security + cross-layer suites
        env: { ORACLE_HOST: '' }
        run: node apps/api/test/security.js && node apps/api/test/xlayer.js && node apps/api/test/ocpp-remote.js
      - name: DB-backed suites (STORE=oracle — adapter write-through)
        run: STORE=oracle npm run test -w apps/api && STORE=oracle npm run test:race -w apps/api
      - name: Invariants gate (real runner — 0 rows or red)
        run: node test/sql/run-invariants.js
      - name: Timescale cagg refresh smoke (closes P2V-01/02 on every push)
        run: |
          PGPASSWORD=volthub_dev_pwd psql -h localhost -U volthub -d volthub -v ON_ERROR_STOP=1 \
            -c "CALL refresh_continuous_aggregate('tick_1m', NULL, NULL);" \
            -c "CALL refresh_continuous_aggregate('tick_1h', NULL, NULL);" \
            -c "CALL refresh_continuous_aggregate('state_1m', NULL, NULL);" \
            -c "SELECT count(*) AS tick_1m_rows FROM tick_1m;" \
            -c "SELECT count(*) AS enriched_rows FROM v_tick_1m_enriched;" \
            -c "SELECT count(*) AS state_rows FROM v_state_1m;"
  e2e:
    needs: db-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install --no-audit --no-fund
      # DBs first (bare containers, like db-tests), then the canonical migrate.sh
      # provisioning path (DEPLOY.md §3). The former timescale initdb mount hid the
      # image's 000/001 setup scripts and ran queries.sql on every boot (exit 3).
      - run: docker compose -f infra/docker-compose.yml up -d oracle timescale || { docker compose -f infra/docker-compose.yml logs --no-color || true; exit 1; }
      - name: Wait for Oracle + Timescale healthy
        run: |
          for i in $(seq 1 60); do
            ok=1
            for c in volthub-oracle volthub-timescale; do
              st=$(docker inspect -f '{{.State.Health.Status}}' "$c" 2>/dev/null || echo none)
              [ "$st" = healthy ] || ok=0
            done
            [ "$ok" = 1 ] && break
            echo "wait db $i"; sleep 5
          done
          docker inspect -f '{{.Name}} {{.State.Health.Status}}' volthub-oracle volthub-timescale
      - name: Migrate + seed (canonical path, shared with db-tests)
        env: { SEED_DB: '1' }
        run: bash scripts/migrate.sh
      - run: docker compose -f infra/docker-compose.yml up -d --build || { echo '--- compose up failed; dumping container logs ---'; docker compose -f infra/docker-compose.yml logs --no-color || true; exit 1; }
      - name: Wait for API then assert health/docs/metrics
        run: |
          for i in $(seq 1 36); do
            if curl -sf http://localhost:4000/api/v1/health/deep | grep -q '"status":"ok"' && curl -sf http://localhost:4000/api/v1/docs | grep -q openapi && curl -sf http://localhost:4000/api/v1/metrics | grep -q volthub_requests_total; then
              echo 'stack healthy'; exit 0
            fi
            echo "wait api $i"; sleep 5
          done
          echo 'API never became healthy'; exit 1
      - run: npm run test:e2e
      - run: docker compose -f infra/docker-compose.yml down
