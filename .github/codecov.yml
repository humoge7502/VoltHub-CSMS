# Codecov runs in informational mode: coverage is published and trended,
# but never a red X on PRs. The project's honesty rule is that claims cite
# receipts (docs/verification.md) — coverage is a signal, not a gate.
codecov:
  require_ci_to_pass: true

comment: false

coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

github_checks:
  annotations: false
