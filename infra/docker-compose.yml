# VoltHub CSMS — one-up seeded stack (masterplan §34). NFR-08: fresh clone -> demo.
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: volthub-oracle
    environment:
      ORACLE_PASSWORD: volthub_dev_pwd
      APP_USER: volthub
      APP_USER_PASSWORD: volthub_dev_pwd
    # BIND_ADDR defaults to all interfaces for Docker Desktop compatibility; set
    # BIND_ADDR=127.0.0.1 in .env to keep published ports off the LAN. TS_HOST_PORT
    # exists because 5432 is often taken by another local Postgres.
    ports: ['${BIND_ADDR:-0.0.0.0}:${ORACLE_HOST_PORT:-1521}:1521']
    volumes:
      - oracle-data:/opt/oracle/oradata
    # Schema + seed are applied by scripts/migrate.sh (DEPLOY.md §3) — single
    # provisioning path, shared with CI. An initdb mount here would hide gvenzl's
    # own hooks and drift from the canonical migrations.
    healthcheck:
      test:
        ['CMD-SHELL', "echo 'select 1 from dual;' | sqlplus -S volthub/volthub_dev_pwd@localhost/freepdb1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  timescale:
    image: timescale/timescaledb:2.17.2-pg16
    container_name: volthub-timescale
    environment:
      POSTGRES_DB: volthub
      POSTGRES_USER: volthub
      POSTGRES_PASSWORD: volthub_dev_pwd
    ports: ['${BIND_ADDR:-0.0.0.0}:${TS_HOST_PORT:-5432}:5432']
    volumes:
      - ts-data:/var/lib/postgresql/data
    # Schema (T001/T002 caggs) applied via scripts/migrate.sh (DEPLOY.md §3). A
    # whole-dir initdb mount also ran queries.sql ($1 params) at every boot and
    # hid the image's own 000/001 setup scripts, killing first boot.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U volthub']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    container_name: volthub-api
    environment:
      PORT: 4000
      ORACLE_HOST: oracle
      ORACLE_SERVICE: freepdb1
      ORACLE_USER: volthub
      ORACLE_PASSWORD: volthub_dev_pwd
      TS_HOST: timescale
      # DEPLOY.md §1: a root .env is NOT read by compose (project dir is infra/) —
      # pass `--env-file .env` or this silently falls back to the dev secret.
      JWT_SECRET: ${JWT_SECRET:-dev-only-32-byte-secret-0123456789}
      # Worker -> API internal routes (outbox poll/ack, stale expiry). Must match the
      # worker's value; compose passes the same interpolation to both services.
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal}
      # Outbox queue bounds (apps/api/src/db/store.js). Compose only injects .env
      # variables this file references, so the queue knobs have to be listed here too.
      OUTBOX_RETENTION_HOURS: ${OUTBOX_RETENTION_HOURS:-24}
      OUTBOX_SOFT_CAP: ${OUTBOX_SOFT_CAP:-20000}
      OUTBOX_HARD_CAP: ${OUTBOX_HARD_CAP:-50000}
      DEAD_LETTER_CAP: ${DEAD_LETTER_CAP:-1000}
      # OCPP 1.6J upgrade auth: per-cp (default), require, or off.
      OCPP_AUTH: ${OCPP_AUTH:-per-cp}
      # SEC-043: unsigned wallet top-ups are demo/test-only. Compose only injects .env
      # variables the yaml references, so this must be listed for the .env flag to work.
      WALLET_UNSIGNED_TOPUP: ${WALLET_UNSIGNED_TOPUP:-}
      # SEC-050: admin bootstrap password. Set this in .env for any public
      # deployment; the code's built-in default is local-dev only.
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      # AI advisory sidecar (ADR-0008). If it is not running, /ai/* returns 503 by
      # design rather than fabricating a forecast.
      AI_URL: ${AI_URL:-http://ai:8100}
      AI_TOKEN: ${AI_TOKEN:-dev-internal}
      # CORS allow-list for the web console. Extend via .env (--env-file) when the
      # console is served from a tunnel/prod origin (DEPLOY.md §2) — e.g.
      # WEB_ORIGIN=https://app.example.com,http://localhost:3000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:3000,http://localhost:3120}
      # Trust proxy headers so per-IP throttles see real clients behind a reverse
      # proxy/tunnel (DEPLOY.md §2, BUG-023). Opt-in: unset = direct exposure.
      TRUST_PROXY: ${TRUST_PROXY:-}
      SEED_PROFILE: demo
      # Load-testing toggle (bench/README.md): set 1 only for k6 runs — the
      # 60 req/min throttle would otherwise count the whole k6 fleet as one IP.
      RATE_LIMIT_OFF: ${RATE_LIMIT_OFF:-0}
    ports: ['${BIND_ADDR:-0.0.0.0}:${API_HOST_PORT:-4000}:4000']
    depends_on:
      oracle: { condition: service_healthy }
      timescale: { condition: service_healthy }
    # Liveness: /health must answer 200 (mode + outbox lag included).
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # API drains in-flight requests on SIGTERM (10 s failsafe) — grace must sit above it.
    stop_grace_period: 15s
    restart: unless-stopped

  worker:
    build: { context: .., dockerfile: apps/api/Dockerfile }
    container_name: volthub-worker
    command: ['node', 'apps/worker/src/index.js']
    environment:
      API_BASE: http://api:4000/api/v1
      INTERNAL_TOKEN: ${INTERNAL_TOKEN:-dev-internal}
      TS_HOST: timescale
      TS_PORT: '5432'
      TS_DB: volthub
      TS_USER: volthub
      TS_PASSWORD: volthub_dev_pwd
      # Relay tuning (see .env.example). Listed here because compose does not pass
      # through a variable the yaml never mentions — the same trap that silently
      # disabled WALLET_UNSIGNED_TOPUP before it was added to the api block.
      RELAY_LAG_SLO_SECONDS: ${RELAY_LAG_SLO_SECONDS:-120}
      STATION_MAP_SYNC_SECONDS: ${STATION_MAP_SYNC_SECONDS:-60}
      TS_POOL_MAX: ${TS_POOL_MAX:-4}
    depends_on:
      api: { condition: service_started }
      timescale: { condition: service_healthy }
    # Worker stops between 2 s cycles; a drained stop is cleaner than SIGKILL mid-ack.
    stop_grace_period: 12s
    restart: unless-stopped

  # Optional advisory sidecar. Opt in with `--profile ai`; the API degrades to
  # 503 AI_UNAVAILABLE when it is absent, so the core stack never depends on it.
  ai:
    build: { context: .., dockerfile: apps/ai/Dockerfile }
    container_name: volthub-ai
    profiles: ['ai']
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: '8100'
      AI_TOKEN: ${AI_TOKEN:-dev-internal}
    ports: ['127.0.0.1:${AI_HOST_PORT:-8100}:8100']
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      # NEXT_PUBLIC_* is baked into the browser bundle here, not at runtime — set it in
      # .env (with --env-file) to point a real deployment at its public API origin.
      args:
        NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    container_name: volthub-web
    environment:
      # Runtime copy: the server-rendered pages read it too, but the browser bundle uses
      # the build arg above. Changing this alone requires a rebuild to take effect.
      NEXT_PUBLIC_API_BASE: ${NEXT_PUBLIC_API_BASE:-http://localhost:4000/api/v1}
    ports: ['${BIND_ADDR:-0.0.0.0}:${WEB_HOST_PORT:-3000}:3000']
    depends_on: [api]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  # Optional: --profile observability (1 hr setup, big demo payoff, §34 SHOULD)
  grafana:
    image: grafana/grafana:11.2.0
    container_name: volthub-grafana
    ports: ['${BIND_ADDR:-0.0.0.0}:${GRAFANA_HOST_PORT:-3001}:3000']
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      timescale: { condition: service_healthy }
    profiles: [observability]

volumes:
  oracle-data: {}
  ts-data: {}
